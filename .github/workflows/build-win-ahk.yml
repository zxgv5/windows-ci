name: build-win-ahk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          repository: AutoHotkey/AutoHotkey
          ref: master
          path: ahk_source
          fetch-depth: 0
          submodules: recursive

      - name: Checkout ci source repo
        uses: actions/checkout@v5
        with:
          path: ci_source

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        working-directory: ahk_source
        run: msbuild AutoHotkeyx.sln /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Build Self-contained x64
        working-directory: ahk_source
        run: msbuild AutoHotkeyx.sln /p:Configuration=Self-contained /p:Platform=x64 /m /v:m /nologo

      - name: Generate timestamp
        shell: bash
        run: echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Rename and move
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/dist/ahk-${{ env.BUILD_DATE }}"
          mkdir -p "$DEST"
          cd ahk_source
          # 主程序（v2 分支为 AutoHotkey64.exe，v1.1 分支为 AutoHotkeyU64.exe，通配符兜两者）
          if ! ls bin/AutoHotkey*64.exe >/dev/null 2>&1; then
            echo "::error::AutoHotkey x64 exe not found under bin/" >&2
            exit 1
          fi
          cp bin/AutoHotkey*64.exe "$DEST/"
          # 自包含运行时（供 Ahk2Exe 嵌入）
          cp bin/AutoHotkeySC*.bin "$DEST/" || true
          cp LICENSE "$DEST/" || true
          find "$DEST" -type f | sort

      # === Release（与 fort 同一 action，路径指向 ci_source 签出）===
      - name: Encrypt package and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ZIP_COMPRESS_LEVEL: '9'
          BUILD_ARTIFACT_PATH: "./dist/ahk-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-ahk"
