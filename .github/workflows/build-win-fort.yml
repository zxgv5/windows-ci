name: build-win-fort

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DATE: ''
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    # Wiki 明确以 VS 2022 为基准（含 WDK 版本配对要求），故钉 2022 镜像。
    runs-on: windows-2022
    steps:
      # === Checkout SELF (root) — 布局规则与前两条线一致：自仓库在根，
      # 上游进子路径。根路径签出上游会清掉 .github/actions。
      - name: Checkout CI repo (self)
        uses: actions/checkout@v5

      - name: Generate timestamp
        shell: bash
        run: echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      # === Upstream to subpath ===
      - name: Checkout fort
        uses: actions/checkout@v5
        with:
          repository: tnodir/fort
          ref: master
          path: fort
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          cd fort
          # ChangeLog 首行通常是 "x.y.z ..." 格式；失败则回退 git tag
          VER=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' ChangeLog 2>/dev/null || true)
          [ -z "$VER" ] && VER=$(git describe --tags --abbrev=0 2>/dev/null || true)
          [ -z "$VER" ] && VER="git-$(git rev-parse --short HEAD)"
          echo "FORT_VERSION=$VER" >> $GITHUB_ENV
          echo "Version: $VER"

      # === Toolchain 1: MSVC x64 dev env（nmake 与 driver 构建都依赖）===
      - name: Setup MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # === Toolchain 2: Qt 6（官方预编译 MSVC x64）===
      # Wiki 流程是从源码静态编 Qt（qt-build.bat，数小时）——CI 用 aqt 预编译
      # 是务实替代。共享链接的运行时依赖由部署阶段的 windeployqt 补齐（见
      # Deploy 步骤内注释）。
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Record Qt directory
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake).Source
          $qtDir = Split-Path (Split-Path $qmake)   # ...\6.8.x\msvc2022_64
          "QT_DIR=$qtDir" | Out-File -Append $env:GITHUB_ENV

      # === Toolchain 3: WDK + Inno Setup ===
      # WDK：choco 的 windowsdriverkit10 经 wdksetup 装最新 WDK（26100）。
      # Inno Setup 6.5.4：.iss 需 6.5.x 窗口期（<6.6.0 的 CreateCustomForm
      #   原型 + ≥6.5 的 TSetupForm.Center）。choco 无 6.5.x，官方安装器直装。
      #   版本验证：编译空壳脚本读 banner——ISCC 的 PE 版本资源恒为
      #   0.0.0.0，/帮助 只显示主版本，都不带小版本。
      - name: Install WDK and pin Inno Setup 6.5.4
        shell: pwsh
        run: |
          choco install windowsdriverkit10 -y
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          # --- 卸载镜像预装版，等目录清空 ---
          $unins = Join-Path $innoDir "unins000.exe"
          if (Test-Path $unins) {
            Start-Process $unins -ArgumentList "/SILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
            $deadline = (Get-Date).AddSeconds(60)
            while ((Test-Path $innoDir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
            if (Test-Path $innoDir) { throw "uninstall of preinstalled Inno did not finish in 60s" }
          }
          # --- 官方静默装 6.5.4（主源 + GitHub 回退） ---
          $dst = "$env:TEMP\innosetup-6.5.4.exe"
          try {
            Invoke-WebRequest "https://files.jrsoftware.org/is/6/innosetup-6.5.4.exe" -OutFile $dst
          } catch {
            Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe" -OutFile $dst
          }
          $p = Start-Process $dst -ArgumentList "/SILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          # --- 诊断 dump：目录内容（确认安装完整性） ---
          Write-Host "=== Inno directory contents ==="
          if (Test-Path $innoDir) {
            Get-ChildItem $innoDir | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          } else {
            throw "Inno directory missing after install: $innoDir"
          }
          $iscc = Join-Path $innoDir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found - see directory dump above" }
          # --- 版本判定：编译极简脚本，从 banner 解析 ---
          # ISCC 的 PE 版本资源恒为 0.0.0.0（10:59/11:13 轮实锤）；
          # ISCC /? 只显示主版本 "6"（11:13 轮实锤）；
          # 唯一可靠来源是实际编译时的 "Compiler engine version" 行。
          $testIss = "$env:TEMP\version_check.iss"
          @(
            '[Setup]'
            'AppName=VC'
            'AppVersion=1.0'
            'DefaultDirName={autopf}\VC'
            'OutputBaseFilename=vc_test'
          ) | Set-Content $testIss -Encoding ASCII
          $compileOutput = & $iscc $testIss 2>&1 | Out-String
          Remove-Item $testIss, "$env:TEMP\vc_test.exe" -ErrorAction SilentlyContinue
          Write-Host "=== ISCC test compile output ==="
          Write-Host $compileOutput
          if ($compileOutput -match 'Compiler engine version:\s*Inno Setup\s+([\d\.]+)') {
            $v = $Matches[1]
            Write-Host "Inno version: $v"
            if ($v -notlike "6.5.4*") { throw "expected Inno 6.5.4, got '$v'" }
          } else {
            throw "could not parse version from ISCC test compile output"
          }

      # === Translations ===
      # release_ts.bat 期望 QT_HOME 环境变量（作者本机全局设了，文件内赋值
      # 被注释）。bat 以 %~dp0 自锚定，调用者 cwd 无关（13:22 run 的源码
      # dump 已验证）。但 call 结束后 cwd 停在 src\ui（其内部 cd 无 pushd），
      # 必须重新锚定再做验证。
      - name: Generate translations
        shell: cmd
        run: |
          cd fort
          set "QT_HOME=%QT_ROOT_DIR%"
          call src\scripts\i18n\release_ts.bat
          rem release_ts.bat leaves cwd at src\ui — re-anchor
          cd /d "%GITHUB_WORKSPACE%\fort"
          echo === .qm files generated ===
          dir /s /b src\ui\i18n\*.qm
          echo QM_FILES_OK

      - name: Build UI (Release x64)
        shell: cmd
        run: |
          cd fort
          if not exist build-win10 mkdir build-win10
          cd build-win10
          qmake ..\src\FortFirewall.pro
          nmake
          if errorlevel 1 exit 1

      # === Driver（win10 x64 only）===
      # win7 驱动已移除：wdksetup 装的 WDK 26100 拒绝 TargetVersion=
      # WindowsV6.3（03:09 轮实锤），而 Wiki 要求 WDK 与 VS SDK 同版本，
      # 即作者文档化的工具链同样造不出 win7 驱动（Wiki 驱动章节也只记载
      # win10 构建法）。UI 是 Qt 6.8.3（Win10+），legacy 驱动在本构建中
      # 无目标系统可言——由下方 deployment.json 补丁将其从安装包剔除。
      - name: Build driver (win10, x64)
        shell: cmd
        run: |
          cd fort\src\driver
          call msvcbuild-win10-64.bat
          if errorlevel 1 exit 1

      # === Patch: create-installer.bat 的 INNO_PATH 是硬编码的作者本地路径 ===
      # 绝对路径 + 8.3 短名（绕 bat 空格转义），不依赖 PATH shim——
      # 卸 6.7.1 装 6.5.4 后 shim 指向性存疑，直接锚死安装位置。
      - name: Patch installer path
        shell: pwsh
        run: |
          $f = "fort\deploy\create-installer.bat"
          (Get-Content $f) -replace 'set INNO_PATH=.*',
            'set INNO_PATH=C:\Progra~2\Inno Setup 6\ISCC.exe' |
            Set-Content $f

      # === Patch: 从部署清单剔除 win7 legacy 驱动 ===
      # 正则按"键含 x86_64_old"宽容匹配（键的确切格式未经逐字节核对，
      # dump 前置保证万一不匹配时日志直接可见真实布局）；
      # 找不到条目或补丁后 JSON 非法均显式 throw——宁可大声失败，
      # 不可静默漏掉。
      - name: Drop legacy win7 driver from deployment
        shell: pwsh
        run: |
          $f = "fort\deploy\deployment.json"
          Write-Host "=== deployment.json (before patch) ==="
          Get-Content $f | Select-Object -First 60 | Write-Host
          $raw = Get-Content $f -Raw
          $patched = $raw -replace '(?s)"[^"]*x86_64_old[^"]*"\s*:\s*\{.*?\},\s*', ''
          if ($patched -eq $raw) { throw "x86_64_old entry not found - see dump above" }
          try { $null = $patched | ConvertFrom-Json }
          catch { throw "patched deployment.json is not valid JSON: $_" }
          Set-Content $f $patched -NoNewline
          Write-Host "=== x86_64_old entry removed ==="

      # === Deploy + Installer（官方脚本）===
      # FIX 1: -BuildPath 为 "..\build"（即默认值）。${BUILD} 是模板前缀，
      #   传 "..\build-win10" 会拼出 "..\build-win10-win10\..."（01:19 轮实锤）。
      # FIX 2: windeployqt 铺共享版 Qt 运行时。deployment.json 是按静态 Qt
      #   写的（零 Qt 条目），我们链接的是共享版，不补则装出的应用缺
      #   Qt6*.dll 无法启动。.iss 的 Source:"build\*" 带 recursesubdirs，
      #   windeployqt 铺的插件子目录会被一并收进安装包。
      #   --no-translations：qtbase 翻译已由 release_ts.bat 合并入 i18n_*.qm。
      - name: Deploy and create installer
        shell: cmd
        run: |
          cd fort\deploy
          call setup-deployment.bat -Config win10 -QtPath "%QT_DIR%" -BuildPath "..\build"
          if errorlevel 1 exit 1
          "%QT_DIR%\bin\windeployqt.exe" --release --no-translations --dir build ..\build-win10\ui_bin\FortFirewall.exe
          if errorlevel 1 exit 1
          call create-installer.bat
          if errorlevel 1 exit 1

      # === Verify（fail fast）===
      # 单驱动（win10）；列出部署树核对 Qt 运行时是否入包（应有 Qt6*.dll、
      # platforms/ 等；缺了即 windeployqt 未生效）；安装包体积应在 15-25MB
      # 区间而非 4MB 裸 exe 级别。
      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UI ==="
          ls -la fort/build-win10/ui_bin/FortFirewall.exe
          echo "=== Driver (win10) ==="
          ls -la fort/build-driver-win10/x64/fortfw.sys
          echo "=== Deployed build tree (Qt runtime present?) ==="
          ls fort/deploy/build/
          echo "=== Installer ==="
          INSTALLER=$(find fort/deploy/out -name "FortFirewall-*.exe" | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "FATAL: installer missing under fort/deploy/out"
            find fort/deploy -type f | head -30
            exit 1
          fi
          echo "INSTALLER_PATH=$INSTALLER" >> $GITHUB_ENV
          sha256sum "$INSTALLER"

      # === Stage ===
      # 安装包是自包含交付物；同时附上裸产物便于审计。
      - name: Rename and move
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/dist/FortFirewall-${{ env.FORT_VERSION }}-x64-${{ env.BUILD_DATE }}"
          mkdir -p "$DEST"
          cp "${{ env.INSTALLER_PATH }}" "$DEST/"
          cp fort/build-win10/ui_bin/FortFirewall.exe "$DEST/FortFirewall-app.exe" || true
          cp fort/build-driver-win10/x64/fortfw.sys "$DEST/fortfw-win10.sys" || true
          find "$DEST" -type f | sort

      # === Release（与 sumatrapdf 同一 action、同一真实路径）===
      - name: Encrypt package and create release
        uses: ./.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ZIP_COMPRESS_LEVEL: '9'
          BUILD_ARTIFACT_PATH: "./dist/FortFirewall-${{ env.FORT_VERSION }}-x64-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-fort-${{ env.FORT_VERSION }}-x64"
